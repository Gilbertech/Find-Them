<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FindMe</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #1877f2 0%, #667eea 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
    }
    .auth-container {
      background: white; border-radius: 20px; box-shadow: 0 25px 50px rgba(0,0,0,0.15);
      padding: 48px 40px; width: 100%; max-width: 440px; position: relative; overflow: hidden;
    }
    .auth-container::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
      background: linear-gradient(90deg, #1877f2, #667eea);
    }
    .auth-header { text-align: center; margin-bottom: 32px; }
    .auth-header .logo-icon {
      width: 64px; height: 64px; background: linear-gradient(135deg, #1877f2, #667eea);
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px; color: white; font-size: 28px;
    }
    .auth-header h2 { color: #1c1e21; font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    .auth-header p { color: #65676b; font-size: 15px; line-height: 1.5; }
    
    .auth-form { margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; position: relative; }
    .form-group label {
      display: block; font-size: 14px; font-weight: 600; color: #1c1e21; margin-bottom: 8px;
    }
    .form-group input {
      width: 100%; padding: 14px 16px; border: 2px solid #e4e6ea; border-radius: 10px;
      font-size: 15px; transition: all 0.2s ease; background: #f0f2f5; font-family: inherit;
    }
    .form-group input:focus {
      outline: none; border-color: #1877f2; background: white; box-shadow: 0 0 0 4px rgba(24,119,242,0.1);
    }
    .form-group input::placeholder { color: #8a8d91; }
    
    .remember-me {
      display: flex; align-items: center; gap: 10px; margin-bottom: 24px; cursor: pointer;
    }
    .remember-me input[type="checkbox"] {
      width: 18px; height: 18px; accent-color: #1877f2; cursor: pointer;
    }
    .remember-me span {
      font-size: 14px; color: #65676b; font-weight: 500; user-select: none;
    }

    .btn-primary {
      width: 100%; background: linear-gradient(135deg, #1877f2 0%, #667eea 100%); color: white;
      border: none; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 600;
      cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(24,119,242,0.3); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .auth-footer { text-align: center; padding-top: 24px; border-top: 1px solid #e4e6ea; }
    .auth-footer p { color: #65676b; font-size: 14px; margin-bottom: 12px; }
    .auth-footer a { color: #1877f2; text-decoration: none; font-weight: 600; transition: color 0.2s; }
    .auth-footer a:hover { color: #166fe5; text-decoration: underline; }
    .landing-link { display: inline-flex; align-items: center; gap: 6px; color: #65676b !important; font-size: 13px; font-weight: 500; }
    .landing-link:hover { color: #1877f2 !important; text-decoration: none !important; }
    
    .form-status {
      display: none; padding: 14px 16px; border-radius: 10px; margin-bottom: 20px; font-size: 14px; font-weight: 500;
      animation: slideDown 0.3s ease;
    }
    .form-status.error { display: block; background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
    .form-status.success { display: block; background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    @media (max-width: 480px) {
      .auth-container { padding: 32px 24px; margin: 16px; }
      .auth-header h2 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo-icon">
        <i class="fas fa-search-location"></i>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to continue helping find missing persons</p>
    </div>

    <div id="form-status" class="form-status"></div>

    <form class="auth-form" id="login-form">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
      </div>
      
      <label class="remember-me">
        <input type="checkbox" id="remember-me" checked>
        <span>Remember me for 30 days</span>
      </label>

      <button type="submit" class="btn-primary" id="submit-btn">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>
    </form>

    <div class="auth-footer">
      <p>Don't have an account? <a href="register.html">Create an account</a></p>
      <p><a href="index.html" class="landing-link">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a></p>
    </div>
  </div>

  <script src="js/env.js"></script>
  <script src="js/auth.js"></script>
  <script>
    redirectIfAuthed();

    const form = document.getElementById("login-form");
    const statusBox = document.getElementById("form-status");
    const submitBtn = document.getElementById("submit-btn");

    function showStatus(message, type) {
      statusBox.textContent = message;
      statusBox.className = `form-status ${type}`;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusBox.className = "form-status"; // hide previous status
      
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';

      // Supabase handles session persistence automatically (localStorage by default).
      const { error } = await supabaseClient.auth.signInWithPassword({ 
        email, 
        password 
      });

      if (error) {
        showStatus(error.message, "error");
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        return;
      }

      showStatus("Login successful! Redirecting...", "success");
      setTimeout(() => {
        window.location.href = "index.html";
      }, 800);
    });
  </script>
</body>
</html>
